name: monitor

on:
  schedule:
    - cron: "0 13 * * 1,4"   # segundas e quintas, 10h de Brasilia
  workflow_dispatch:          # botao manual na aba Actions

permissions:
  contents: write             # para commitar o state.json atualizado

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
      - name: Guardar o estado
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: atualiza estado do monitor"
          git push
