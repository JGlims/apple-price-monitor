name: monitor

on:
  schedule:
    - cron: "17 13 * * 1,4"   # segundas e quintas, ~10h de Brasilia
  workflow_dispatch:
    inputs:
      force_notify:
        description: "Mandar mensagem no Telegram mesmo sem novidade"
        type: boolean
        default: true

permissions:
  contents: write             # para commitar o state.json atualizado

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rodar os testes
        # Contra a amostra salva, sem rede. Se a Apple mudar os nomes dos
        # campos, o codigo novo falha aqui em vez de passar a devolver
        # zeros calados em producao.
        run: python testes/teste_parse.py

      - name: Conferir se os secrets chegaram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          test -n "$TELEGRAM_TOKEN"   || { echo "::error::TELEGRAM_TOKEN nao esta configurado"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "::error::TELEGRAM_CHAT_ID nao esta configurado"; exit 1; }
          echo "secrets presentes (token com ${#TELEGRAM_TOKEN} caracteres)"

      - name: Rodar monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.force_notify }}
        run: |
          # Segunda-feira leva --digest: manda o retrato do mercado mesmo
          # sem novidade. Sem isso, "nada aconteceu" e "o monitor quebrou"
          # chegam exatamente iguais na sua tela — que foi o que aconteceu
          # por tres semanas. Quinta continua calada a menos que haja noticia.
          if [ "$FORCE" = "true" ]; then
            python monitor.py --force-notify
          elif [ "$(date -u +%u)" = "1" ]; then
            python monitor.py --digest
          else
            python monitor.py
          fi

      - name: Guardar o estado
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "chore: atualiza estado do monitor"
          git push
